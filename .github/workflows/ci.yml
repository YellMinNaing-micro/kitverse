name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none

      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            xargs -0 -r -n 1 php -l

      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Check patch whitespace
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

  database-smoke:
    name: Database smoke test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Import fresh schema and sample catalog
        env:
          MYSQL_PWD: root
        run: |
          mariadb --host=127.0.0.1 --user=root < database/schema.sql
          mariadb --host=127.0.0.1 --user=root kitverse_db < database/sample_catalog.sql

      - name: Verify application database connection and catalog
        env:
          KITVERSE_DB_USER: root
          KITVERSE_DB_PASS: root
        run: |
          php -r 'require "bootstrap.php"; $tables = (int) db()->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()")->fetchColumn(); $products = (int) db()->query("SELECT COUNT(*) FROM products")->fetchColumn(); $discounts = (int) db()->query("SELECT COUNT(*) FROM products WHERE discount_percent = 0")->fetchColumn(); if ($tables !== 11 || $products !== 14 || $discounts !== $products) { fwrite(STDERR, "Unexpected schema or sample catalog\n"); exit(1); } echo "Database ready: $tables tables, $products products\n";'
